services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      MAX_RUNS_CONCURRENTES: "2"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_WS_URL: ws://localhost:${BACKEND_PORT:-8000}/ws/evolucion
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
